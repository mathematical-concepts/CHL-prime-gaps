[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chl-prime-gaps"
version = "1.8"
description = "Conditional Hardy-Littlewood Markov kernels for consecutive prime gaps"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Jose Antonio Cano Gregorio"}]
license = {text = "MIT"}
dependencies = [
    "tabulate>=0.9",
    "numpy>=1.23",
    "pandas>=1.5",
    "pytest>=9.0.3",
    "scipy>=1.10",
]

[tool.setuptools]
packages = ["chl_kernel"]
